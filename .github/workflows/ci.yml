name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - '29.1'   # minimum supported (Package-Requires floor)
          - '29.4'   # latest stable 29.x
          - '30.2'   # current stable; what this theme actually runs in daily
        include:
          - emacs_version: snapshot  # the Emacs 31 canary: a red leg is signal

    name: Emacs ${{ matrix.emacs_version }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Emacs
        uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5 # v8.0
        with:
          version: ${{ matrix.emacs_version }}

      - name: Emacs version
        run: emacs --version

      - name: Byte-compile (warnings are errors)
        run: make compile

      - name: Load theme without error
        run: make load

      - name: Load Wave theme without error
        run: make load-wave

      - name: ERT test suite
        run: make test
